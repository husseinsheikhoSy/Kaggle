<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kaggle Dataset Access — Verification</title>
    <meta name="description" content="Complete two quick verification steps to unlock free access to this Kaggle dataset." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0A0708" />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://w.tads.me/widget.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap');

        :root {
            /* Palette: Black & Scarlet Red */
            --bg-body:      #0A0708;
            --bg-2:         #170A0C;
            --bg-card:      #140A0B;
            --text-main:    #F5EAEB;
            --text-muted:   #B08D91;
            --primary:      #E01143;   /* scarlet red */
            --primary-dark: #7A0526;
            --primary-bright:#FF2E63;
            --primary-pale: rgba(224,17,67,.16);
            --primary-glow: rgba(224,17,67,.38);
            --success:      #10b981;
            --success-bg:   rgba(16,185,129,.12);
            --border-color: #341318;
            --item-bg:      rgba(255,255,255,.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(180deg, var(--bg-body) 0%, #000 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(180deg, var(--bg-card) 0%, #0B0506 100%);
            border: 1px solid var(--border-color);
            border-radius: 26px;
            padding: 26px 22px;
            box-shadow: 0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
            position: relative;
            animation: slideUp 0.5s cubic-bezier(.22,.61,.36,1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 21px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.4px;
        }

        .progress-text {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary-bright);
            text-shadow: 0 0 16px var(--primary-glow);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        /* Task List Styles */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 13px 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .task-item.disabled {
            opacity: 0.45;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .task-item.completed {
            border-color: rgba(16, 185, 129, 0.3);
            background: var(--success-bg);
        }

        .task-info-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(180deg, var(--primary-bright) 0%, var(--primary-dark) 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 2px 8px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,.25);
            flex-shrink: 0;
        }

        .task-item.completed .task-icon {
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            box-shadow: 0 2px 8px rgba(16,185,129,.3);
        }

        .task-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .task-reward {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Buttons */
        .task-btn {
            background: rgba(255,255,255,.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 9px 16px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .task-btn:not(:disabled):active {
            transform: scale(0.95);
            border-color: var(--primary);
        }

        .task-btn.done {
            background: transparent;
            border-color: transparent;
            color: var(--success);
            font-size: 16px;
            pointer-events: none;
        }

        /* iOS-style filled CTA */
        .main-btn {
            width: 100%;
            padding: 17px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -.2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.18s ease;
        }

        .main-btn.disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .main-btn.active {
            background: linear-gradient(180deg, var(--primary-bright) 0%, var(--primary) 55%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 8px 26px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,.25);
            animation: pulse 2s infinite;
        }

        .main-btn.active:active {
            transform: scale(0.97);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--primary-glow); }
            70% { box-shadow: 0 0 0 12px rgba(224,17,67,0); }
            100% { box-shadow: 0 0 0 0 rgba(224,17,67,0); }
        }

        .toast {
            display: none;
            text-align: center;
            font-size: 13px;
            color: var(--primary-bright);
            background: var(--primary-pale);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            font-weight: 700;
        }
        .toast.visible { display: block; }
        .toast.error { color: #FF7A7A; background: rgba(255,80,80,.1); border-color: rgba(255,80,80,.25); }

        /* === TGB Ad Container Styles === */
        .tgb-ad-wrapper {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .tgb-ad-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            opacity: 0.7;
        }

        #tads-container-9639 {
            width: 100%;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #tads-container-9639:empty {
            display: none;
        }

        .disclaimer-note {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 18px;
            line-height: 1.6;
            padding: 0 4px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-top">
            <h1>Verification</h1>
            <span class="progress-text" id="progress-text">0/2</span>
        </div>
        <p class="subtitle">Complete the two quick steps below to unlock your Kaggle dataset access — no payment, no account needed.</p>

        <div class="task-list">
            <div class="task-item" id="task1">
                <div class="task-info-wrapper">
                    <div class="task-icon" id="icon1">1</div>
                    <div>
                        <div class="task-title">Watch ad #1</div>
                        <div class="task-reward" id="reward1">Tap to start</div>
                    </div>
                </div>
                <button class="task-btn" id="btn-ad1" onclick="watchAd(1)">Start</button>
            </div>

            <div class="task-item disabled" id="task2">
                <div class="task-info-wrapper">
                    <div class="task-icon" id="icon2">2</div>
                    <div>
                        <div class="task-title">Watch ad #2</div>
                        <div class="task-reward" id="reward2">Unlocks after step 1</div>
                    </div>
                </div>
                <button class="task-btn" id="btn-ad2" onclick="watchAd(2)" disabled>Start</button>
            </div>
        </div>

        <button class="main-btn disabled" id="btn-final" onclick="goToDataset()" disabled>
            🔒 Complete steps to unlock
        </button>
        <div class="toast" id="toast" role="status"></div>

        <div class="tgb-ad-wrapper">
            <span class="tgb-ad-label">Sponsored Content</span>
            <div id="tads-container-9639"></div>
        </div>

        <p class="disclaimer-note">
            Completing the two quick steps unlocks the dataset link —
            no payment, no account needed.
        </p>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram?.WebApp || null;
        if (tg) {
            tg.ready(); tg.expand();
            if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
            try { tg.setHeaderColor('#0A0708'); } catch (e) {}
            try { tg.setBackgroundColor('#0A0708'); } catch (e) {}
        }

        /* ---------------- tads.me configuration ----------------
           Step 1 -> fullscreen widget #9604
           Step 2 -> fullscreen widget #12051
           Sponsored slot -> TGB widget #9639
        ------------------------------------------------------- */
        const FULLSCREEN_WIDGET_BY_STEP = { 1: '9604', 2: '12051' };
        const TGB_WIDGET_ID = '9639';
        const TADS_DEBUG = false; // set to true only while testing

        const tadsControllers = {};
        let currentStep = 1;
        let isAdPlaying = false;

        // Retrieve Target URL (Kaggle Default)
        function getTargetUrl() {
            const code = tg?.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get('startapp');
            if (!code) return 'https://www.kaggle.com/';
            try {
                const decoded = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
                return decoded.startsWith('http') ? decoded : 'https://www.kaggle.com/';
            } catch (e) { return 'https://www.kaggle.com/'; }
        }
        const TARGET_URL = getTargetUrl();

        function waitForTadsReady(timeout = 6000) {
            return new Promise((resolve, reject) => {
                if (window.tads && typeof window.tads.init === 'function') return resolve();
                const start = performance.now();
                const iv = setInterval(() => {
                    if (window.tads && typeof window.tads.init === 'function') {
                        clearInterval(iv);
                        resolve();
                    } else if (performance.now() - start > timeout) {
                        clearInterval(iv);
                        reject(new Error('tads.me widget script did not load in time'));
                    }
                }, 50);
            });
        }

        // Shows the fullscreen ad tied to a given verification step and
        // resolves true only once the user has actually watched/earned reward.
        function showRewardedAd(step) {
            const widgetId = FULLSCREEN_WIDGET_BY_STEP[step];
            return new Promise((resolve) => {
                let rewarded = false;
                waitForTadsReady()
                    .then(() => {
                        if (!tadsControllers[widgetId]) {
                            tadsControllers[widgetId] = window.tads.init({
                                widgetId: widgetId,
                                type: 'fullscreen',
                                debug: TADS_DEBUG,
                                onShowReward: () => { rewarded = true; },
                                onAdsNotFound: () => resolve(false),
                            });
                        }
                        return Promise.resolve(tadsControllers[widgetId]);
                    })
                    .then((controller) => {
                        if (!controller || typeof controller.showAd !== 'function') {
                            throw new Error('tads.me ad controller not ready');
                        }
                        return controller.showAd();
                    })
                    .then(() => resolve(true))
                    .catch((err) => {
                        console.error('tads.me ad error', err);
                        resolve(rewarded);
                    });
            });
        }

        function initTGBAd() {
            waitForTadsReady()
                .then(() => window.tads.init({
                    widgetId: TGB_WIDGET_ID,
                    type: 'static',
                    debug: TADS_DEBUG,
                    onAdsNotFound: () => {
                        const el = document.getElementById('tads-container-' + TGB_WIDGET_ID);
                        if (el) el.style.display = 'none';
                    },
                }))
                .then((controller) => {
                    if (!controller || typeof controller.loadAd !== 'function') return;
                    return controller.loadAd().then(() => controller.showAd());
                })
                .catch((err) => console.error('tads.me TGB error', err));
        }

        window.addEventListener('load', initTGBAd);

        function showToast(msg, isError) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast visible' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('visible'), 4000);
        }

        async function watchAd(step) {
            if (step !== currentStep || isAdPlaying) return;
            isAdPlaying = true;

            const btn = document.getElementById('btn-ad' + step);
            const reward = document.getElementById('reward' + step);
            btn.innerText = '⏳';
            btn.disabled = true;
            reward.textContent = 'Loading ad…';

            const ok = await showRewardedAd(step);
            isAdPlaying = false;

            if (!ok) {
                btn.innerText = 'Start';
                btn.disabled = false;
                reward.textContent = 'Tap to start';
                showToast('No ad available right now — please try again.', true);
                return;
            }

            handleAdSuccess(step);
        }

        function handleAdSuccess(step) {
            const btn = document.getElementById('btn-ad' + step);
            const item = document.getElementById('task' + step);
            const icon = document.getElementById('icon' + step);
            const reward = document.getElementById('reward' + step);

            btn.innerText = '✅';
            btn.classList.add('done');
            item.classList.add('completed');
            icon.innerText = '✓';
            reward.textContent = 'Done';

            document.getElementById('progress-text').innerText = step + '/2';
            currentStep = step + 1;

            if (currentStep === 2) {
                document.getElementById('task2').classList.remove('disabled');
                document.getElementById('btn-ad2').disabled = false;
                document.getElementById('reward2').textContent = 'Tap to start';
            } else if (currentStep > 2) {
                const finalBtn = document.getElementById('btn-final');
                finalBtn.classList.remove('disabled');
                finalBtn.classList.add('active');
                finalBtn.disabled = false;
                finalBtn.innerHTML = '🚀 Download Dataset';
                showToast('✅ Unlocked! Tap Download Dataset.');
            }
        }

        function goToDataset() {
            if (tg?.openLink) {
                tg.openLink(TARGET_URL);
                setTimeout(() => tg.close(), 1000);
            } else {
                window.location.href = TARGET_URL;
            }
        }
    </script>
</body>
</html>
