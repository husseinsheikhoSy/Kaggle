<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kaggle Dataset Access - 2 Steps</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://w.tads.me/widget.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --kg-blue: #00AFEF;
      --kg-bg: #F5F5F5;
      --kg-card: #FFFFFF;
      --kg-text: #202124;
      --kg-hint: #5F6368;
      --kg-border: #DADCE0;
      --kg-success: #00C176;
      --radius-lg: 16px;
    }

    body {
      background: var(--kg-bg);
      color: var(--kg-text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0;
    }

    .page {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .hero {
      text-align: center;
      margin-top: 20px;
      gap: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .icon-outer {
      width: 70px;
      height: 70px;
      background: rgba(0, 175, 239, 0.1);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .hero-title {
      font-size: 22px;
      font-weight: 700;
    }

    .hero-title span {
      color: var(--kg-blue);
    }

    /* Progress & Tasks */
    .progress-wrap {
      width: 100%;
      margin-top: 24px;
    }

    .task-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--kg-card);
      border: 1px solid var(--kg-border);
      padding: 12px 16px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .task-item.disabled {
      opacity: 0.5;
      pointer-events: none;
      background: #eee;
    }

    .task-item.completed {
      border-color: var(--kg-success);
      background: rgba(0, 193, 118, 0.05);
    }

    .task-btn {
      background: var(--kg-blue);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .task-btn.done {
      background: transparent;
      color: var(--kg-success);
      cursor: default;
    }

    /* Final Button */
    .btn-final {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-lg);
      border: none;
      font-size: 16px;
      font-weight: 700;
      margin-top: 20px;
      background: var(--kg-border);
      color: var(--kg-hint);
      cursor: not-allowed;
      transition: 0.3s;
    }

    .btn-final.active {
      background: var(--kg-success);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 193, 118, 0.3);
    }

    /* TGB Ad Section */
    .tgb-wrapper {
      margin-top: auto;
      padding-top: 20px;
      width: 100%;
      text-align: center;
    }

    #tads-container-9639 {
      min-height: 90px;
      margin-top: 10px;
      border-top: 1px dashed var(--kg-border);
      padding-top: 10px;
    }

    #s-loading {
      justify-content: center;
      height: 100vh;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 3px solid rgba(0, 175, 239, 0.1);
      border-top-color: var(--kg-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div id="s-loading" class="screen active">
      <div class="spinner"></div>
    </div>

    <div id="s-main" class="screen">
      <div class="hero">
        <div class="icon-outer">📊</div>
        <h1 class="hero-title">Verification <span>Required</span></h1>
        <p style="color:var(--kg-hint); font-size:13px;">Complete 2 steps to unlock your dataset.</p>
      </div>

      <div class="progress-wrap">
        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700">
          <span style="color:var(--kg-hint)">PROGRESS</span>
          <span id="progress-text" style="color:var(--kg-blue)">0 / 2</span>
        </div>

        <div class="task-list">
          <div class="task-item" id="task1">
            <div style="display:flex; align-items:center; gap:12px">
              <span id="icon1">1️⃣</span>
              <div style="font-size:14px; font-weight:600">First Verification</div>
            </div>
            <button class="task-btn" id="btn-ad1" onclick="watchAd(1)">Start</button>
          </div>

          <div class="task-item disabled" id="task2">
            <div style="display:flex; align-items:center; gap:12px">
              <span id="icon2">2️⃣</span>
              <div style="font-size:14px; font-weight:600">Final Verification</div>
            </div>
            <button class="task-btn" id="btn-ad2" onclick="watchAd(2)" disabled>Start</button>
          </div>
        </div>
      </div>

      <button class="btn-final" id="btn-final" disabled onclick="goToDataset()">
        🔒 Complete Steps to Unlock
      </button>

      <div class="tgb-wrapper">
        <small style="color:var(--kg-hint); font-size:9px; letter-spacing:1px">ADS BY TADS</small>
        <div id="tads-container-9639"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp || null;
    if (tg) { tg.ready(); tg.expand(); }

    const FULLSCREEN_ID = "9604";
    const TGB_ID = "9639";
    let fullscreenAd = null;
    let currentStep = 1;
    let isAdPlaying = false;

    function getTargetUrl() {
      const code = tg?.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get('startapp');
      if (!code) return 'https://www.kaggle.com/';
      try { return atob(code.replace(/-/g, '+').replace(/_/g, '/')); } catch (e) { return 'https://www.kaggle.com/'; }
    }
    const TARGET_URL = getTargetUrl();

    function initAds() {
      let checkTads = setInterval(() => {
        if (window.tads && window.tads.init) {
          clearInterval(checkTads);

          fullscreenAd = window.tads.init({
            widgetId: FULLSCREEN_ID,
            type: 'fullscreen',
            onShowReward: () => handleAdSuccess(),
            onAdsNotFound: () => handleAdSuccess(), // Fallback
            onError: () => resetBtn()
          });

          const tgb = window.tads.init({
            widgetId: TGB_ID,
            type: 'static',
            onAdsNotFound: () => document.getElementById(`tads-container-${TGB_ID}`).style.display = 'none'
          });
          tgb.loadAd().then(() => tgb.showAd());

          document.getElementById('s-loading').classList.remove('active');
          document.getElementById('s-main').classList.add('active');
        }
      }, 200);
    }

    function watchAd(step) {
      if (step !== currentStep || isAdPlaying) return;
      isAdPlaying = true;

      const btn = document.getElementById(`btn-ad${step}`);
      btn.disabled = true;
      btn.textContent = "⏳...";

      if (fullscreenAd) {
        fullscreenAd.showAd().catch(() => handleAdSuccess());
      } else {
        handleAdSuccess();
      }
    }

    function handleAdSuccess() {
      isAdPlaying = false;
      const btn = document.getElementById(`btn-ad${currentStep}`);
      const item = document.getElementById(`task${currentStep}`);
      const icon = document.getElementById(`icon${currentStep}`);

      btn.textContent = "✅";
      btn.classList.add('done');
      item.classList.add('completed');
      icon.textContent = "✓";

      document.getElementById('progress-text').textContent = `${currentStep} / 2`;

      if (currentStep === 1) {
        currentStep = 2;
        const nextItem = document.getElementById('task2');
        const nextBtn = document.getElementById('btn-ad2');
        nextItem.classList.remove('disabled');
        nextBtn.disabled = false;
      } else {
        const finalBtn = document.getElementById('btn-final');
        finalBtn.disabled = false;
        finalBtn.classList.add('active');
        finalBtn.innerHTML = "🚀 Download Dataset Now";
      }
    }

    function resetBtn() {
      isAdPlaying = false;
      const btn = document.getElementById(`btn-ad${currentStep}`);
      btn.disabled = false;
      btn.textContent = "Start";
    }

    function goToDataset() {
      if (tg?.openLink) {
        tg.openLink(TARGET_URL);
        setTimeout(() => tg.close(), 600);
      } else { window.location.href = TARGET_URL; }
    }

    window.addEventListener('load', initAds);
  </script>
</body>

</html>
